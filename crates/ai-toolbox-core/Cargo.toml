[package]
name = "ai-toolbox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads the ai-toolbox catalogue and what a repo has installed from it."

[features]
# Lets the CLI's and the server's own tests build repo fixtures from the real
# catalogue, instead of each crate growing its own copy of the same setup code.
testing = ["dep:tempfile"]

[dependencies]
tempfile = { version = "3", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true

[dev-dependencies]
# Depending on itself with the feature on is what lets tests/ build repo fixtures from
# the real catalogue - an integration test links the lib as an external crate, so a
# `#[cfg(test)]` module would not be visible to it.
ai-toolbox-core = { path = ".", features = ["testing"] }
tempfile = "3"

[lints]
workspace = true
